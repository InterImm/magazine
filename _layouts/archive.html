---
layout: default
---
<header class="page-hero">
  <div class="wrap">
    <nav class="crumbs kicker" aria-label="breadcrumb"><a href="{{ site.url }}/">{{ site.title }}</a></nav>
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}
    <p class="lede">{{ page.lede }}</p>
    {%- endif %}
  </div>
</header>
<div class="section mag-archive">
  <div class="wrap mag-archive-body">
    {{ content }}
  </div>
</div>
